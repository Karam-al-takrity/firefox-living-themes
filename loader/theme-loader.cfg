// Firefox autoconfig: theme loader. (The first line of this file must be a comment.)
// Goes in the Firefox install folder, next to firefox.exe, together with
// defaults/pref/autoconfig.js. It does one thing: in every browser window it
// reads <profile>/chrome/userChrome.css, finds the active theme from the line
//     @import url("themes/<name>/userChrome.css");
// and, if that theme folder has a chrome.js, runs it in the window.
// Themes without a chrome.js are unaffected, so it is safe for a theme switcher.
try {
  const Svc = globalThis.Services ||
    ChromeUtils.importESModule("resource://gre/modules/Services.sys.mjs").Services;
  // Firefox only runs chrome scripts from trusted addresses, so the profile's
  // chrome folder is made reachable as resource://user-chrome/
  let mapped = false;
  const mapChromeDir = chromeDir => {
    if (mapped) return;
    Svc.io.getProtocolHandler("resource")
      .QueryInterface(Components.interfaces.nsIResProtocolHandler)
      .setSubstitution("user-chrome", Svc.io.newFileURI(chromeDir));
    mapped = true;
  };
  Svc.obs.addObserver(function themeLoader(win) {
    try {
      const chromeDir = Svc.dirsvc.get("ProfD", Components.interfaces.nsIFile);
      chromeDir.append("chrome");
      mapChromeDir(chromeDir);
      const base = "resource://user-chrome/";
      win.fetch(base + "userChrome.css")
        .then(r => r.text())
        .then(css => {
          const m = css.match(/@import\s+url\(\s*["']?themes\/([\w-]+)\//);
          if (!m) return;
          const script = chromeDir.clone();
          script.append("themes");
          script.append(m[1]);
          script.append("chrome.js");
          if (!script.exists()) return;
          const scope = {
            window: win,
            document: win.document,
            Services: Svc,
            console: win.console,
            themeName: m[1],
            themeURL: base + "themes/" + m[1] + "/",
          };
          Svc.scriptloader.loadSubScript(
            base + "themes/" + m[1] + "/chrome.js?" + script.lastModifiedTime, scope);
        })
        .catch(e => Components.utils.reportError("theme-loader: " + e));
    } catch (e) {
      Components.utils.reportError("theme-loader: " + e);
    }
  }, "browser-delayed-startup-finished");
} catch (e) {
  Components.utils.reportError("theme-loader: " + e);
}
